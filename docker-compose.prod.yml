version: '3.7'

services:
  web:
    restart: unless-stopped
    image: ghcr.io/alexsierro/fabman:latest
    command: gunicorn fabman.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/home/app/web/static
      - media_volume:/home/app/web/media
      - ./:/home/app/web/
      - .aws/:/home/app/.aws
    expose:
      - 8000
    env_file:
      - ./.env.prod
      - ./email.env
      - ./keycloak.prod.env
      - ./.env.prod.host
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, os;
          connection = http.client.HTTPConnection('127.0.0.1', 8000, timeout=5);
          connection.request('GET', '/admin/login/', headers={'Host': os.environ.get('VIRTUAL_HOST', 'localhost')});
          response = connection.getresponse();
          raise SystemExit(0 if 200 <= response.status < 400 else 1)
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    depends_on:
      - db
  db:
    restart: unless-stopped
    image: postgres:16.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod.db
  nginx:
    restart: unless-stopped
    build: ./nginx
    volumes:
      - static_volume:/home/app/web/static
      - media_volume:/home/app/web/media
    expose:
      - 1337
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - ./.env.prod.host
volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  default:
    external:
      name: proxy_default
