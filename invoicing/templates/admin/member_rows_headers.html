{% for header in headers %}
    <th scope="col" class="column-{{ header.key }} sortable{% if header.sorted %} sorted {{ header.ascending|yesno:'ascending,descending' }}{% endif %}{% if header.amount %} amount{% endif %}">
        {% if header.sorted %}
            <div class="sortoptions">
                <a class="sortremove" href="?" title="Remove from sorting"></a>
                <a href="{{ header.url }}" class="toggle {{ header.ascending|yesno:'ascending,descending' }}" title="Toggle sorting"></a>
            </div>
        {% endif %}
        <div class="text"><a href="{{ header.url }}">{{ header.label }}</a></div>
        <div class="clear"></div>
    </th>
{% endfor %}
