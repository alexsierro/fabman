# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ develop, main]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: true

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 .
      continue-on-error: true
    - name: Test
      run: |
        pip install pytest
        python manage.py test


  build-push-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
        - uses: actions/checkout@v2

        - name: 'Login to GitHub Container Registry'
          uses: docker/login-action@v1
          with:
            registry: ghcr.io
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}

        - name: 'Build and push app image'
          run: |
              docker build . --tag ghcr.io/alexsierro/fabman:latest -f Dockerfile.prod
              docker push ghcr.io/alexsierro/fabman:latest


  deploy:
    runs-on: ubuntu-latest
    needs: build-push-image
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency: production

    steps:
        - name: 'Deploy over SSH'
          env:
            SSH_KEY: ${{secrets.DEPLOY_SSH_KEY}}
            KNOWN_HOSTS: ${{secrets.DEPLOY_KNOWN_HOSTS}}
            HOST: ${{secrets.DEPLOY_HOST}}
            USER: ${{secrets.DEPLOY_USER}}
          run: |
              mkdir -p ~/.ssh
              echo "$SSH_KEY" > ~/.ssh/deploy_key
              chmod 600 ~/.ssh/deploy_key
              echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
              # The key's forced command on the server runs scripts/deploy.sh
              ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$USER@$HOST"
